name: Build Media3 FFmpeg 1.11.1 EAC3 LGPL

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android build tools
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;26.1.10909125"             "cmake;3.22.1"
          echo "NDK_PATH=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Fetch exact Media3 and FFmpeg sources
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 1.11.1 https://github.com/androidx/media.git media3
          git clone --depth 1 --branch release/6.0 https://github.com/FFmpeg/FFmpeg.git             media3/libraries/decoder_ffmpeg/src/main/jni/ffmpeg
          python3 - <<'PY'
          from pathlib import Path
          p = Path("media3/libraries/decoder_ffmpeg/build.gradle.kts")
          s = p.read_text()
          needle = 'android {\n  namespace = "androidx.media3.decoder.ffmpeg"'
          repl = 'android {\n  namespace = "androidx.media3.decoder.ffmpeg"\n  ndkVersion = "26.1.10909125"'
          if needle not in s:
              raise SystemExit("decoder_ffmpeg build.gradle.kts shape changed")
          p.write_text(s.replace(needle, repl, 1))
          PY

      - name: Build LGPL-only FFmpeg audio libraries
        shell: bash
        working-directory: media3/libraries/decoder_ffmpeg/src/main/jni
        run: |
          set -euxo pipefail
          ./build_ffmpeg.sh             "$GITHUB_WORKSPACE/media3/libraries/decoder_ffmpeg/src/main"             "$NDK_PATH"             linux-x86_64             23             ac3 eac3

      - name: Build official Media3 FFmpeg decoder AAR
        shell: bash
        working-directory: media3
        run: |
          set -euxo pipefail
          ./gradlew :lib-decoder-ffmpeg:assembleRelease --no-daemon

      - name: Package provenance and verify payload
        id: package
        shell: bash
        run: |
          set -euxo pipefail
          AAR="$(find media3/libraries/decoder_ffmpeg/buildout/outputs/aar -name '*release.aar' -type f | head -1)"
          test -n "$AAR"
          mkdir -p artifact/check
          cp "$AAR" artifact/media3-decoder-ffmpeg-1.11.1-eac3-lgpl.aar
          cp media3/LICENSE artifact/ANDROIDX_APACHE-2.0.txt
          cp media3/libraries/decoder_ffmpeg/src/main/jni/ffmpeg/COPYING.LGPLv2.1 artifact/FFMPEG_LGPL-2.1.txt
          cp media3/libraries/decoder_ffmpeg/src/main/jni/build_ffmpeg.sh artifact/build_ffmpeg.sh
          unzip -q artifact/media3-decoder-ffmpeg-1.11.1-eac3-lgpl.aar -d artifact/check
          find artifact/check/jni -name 'libffmpegJNI.so' -print | sort
          test -f artifact/check/classes.jar
          COUNT="$(find artifact/check/jni -name 'libffmpegJNI.so' | wc -l)"
          test "$COUNT" -eq 4
          SHA="$(sha256sum artifact/media3-decoder-ffmpeg-1.11.1-eac3-lgpl.aar | awk '{print $1}')"
          cat > artifact/PROVENANCE.txt <<EOF
          Smooth IPTV Player Media3 FFmpeg audio decoder
          Media3 tag: 1.11.1
          Media3 wrapper license: Apache-2.0
          FFmpeg branch: release/6.0
          FFmpeg license configuration: LGPL-2.1-or-later; upstream build script used without --enable-gpl or --enable-nonfree
          Enabled FFmpeg decoders: ac3 eac3
          Android NDK: 26.1.10909125
          Android ABI level: 23
          ABIs: armeabi-v7a arm64-v8a x86 x86_64
          AAR SHA-256: $SHA
          GitHub Actions run: $GITHUB_RUN_ID
          EOF
          rm -rf artifact/check
          echo "aar_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload decoder artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: media3-ffmpeg-1.11.1-eac3-lgpl
          path: artifact/
          if-no-files-found: error
          retention-days: 30

